name: ahorrant
description: App Ahorrant - Finanzas personales gamificadas para universitarios
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino icons icons.
  cupertino_icons: ^1.0.6

  # Plugins utilizados en el proyecto
  http: ^1.2.0        # Para peticiones HTTP al backend
  shared_preferences: ^2.2.2  # Almacenamiento local
  sqflite: ^2.2.4     # Base de datos SQLite local
  path_provider: ^2.1.0 # Rutas de acceso en dispositivo
  path: ^1.9.0        # Manipulación de rutas de archivos y bd

  # Notificaciones
  firebase_messaging: ^14.8.0  # Notificaciones push (Firebase)

  # Fuentes divertidas
  google_fonts: ^6.2.1

  # Generador de iconos de launcher
  flutter_launcher_icons: ^0.13.1

  # Pantalla de bienvenida
  flutter_native_splash: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  path_provider_foundation: 2.4.1

# Para fusos horarios y formateo
flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/hormiguita.png
    - assets/prendas/Hormiga_sin_prendas.png
    - assets/prendas/Hormiga_con_gorra.png
    - assets/prendas/Hormiga_con_lentes.png
    - assets/prendas/Hormiga_con_mochila.png
    - assets/prendas/Hormiga_lentes_gorra.png
    - assets/prendas/Hormiga_mochila_gorra.png
    - assets/prendas/Hormiga_mochila_lentes.png
    - assets/prendas/Hormiga_lentes_gorra_mochila.png

# Configuración de la pantalla de bienvenida
flutter_native_splash:
  color: "#ffffff"
  image: assets/hormiguita.png